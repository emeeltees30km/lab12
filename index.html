<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #car1 {
            width: 250px;
            position: absolute;
            margin-left: -50px;
            margin-top: 5px;
        }

        #car2 {
            width: 250px;
            position: absolute;
            margin-left: 100px;
            margin-top: 5px;
        }

        div {
            background-image: url(zam.jpg);
            background-repeat: none;
            width: 310px;
            height: 850px;
            margin-left: 3px;
        }
    </style>
</head>
<body onkeypress="uraldah(event)">
    <div>
        <img id="car1"src="car1.png" />
        <img id="car2" src="car2.png" />
    </div>
    
</body>
<script>
    let car1 = document.getElementById("car1")
    let car2 = document.getElementById("car2")
    let a1 = 0
    let a2 = 0
    function uraldah(event){
        if(event.key=="w"){
            a1+=50
            car1.style.marginTop= a1+"px"
        }else if(event.key=="i"){
            a2+=50
            car2.style.marginTop=a2+"px"
        }

        if(a1 == 600){
            alert("MASHIN 1 Hojloo")
            a1=0
            a2=0
            car1.style.marginTop=0+"px"
            car2.style.marginTop=0+"px"
        }else if(a2 == 600){
            alert("MASHIN 2 Hojloo")
            a1=0
            a2=0
            car1.style.marginTop=0+"px"
            car2.style.marginTop=0+"px"
        }

    }
</script>

</html>
